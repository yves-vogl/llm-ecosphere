name: OpenSSF Scorecard

on:
  # Re-run weekly so the score reflects current branch-protection and
  # workflow state even when there are no pushes.
  schedule:
    - cron: "0 6 * * 1"
  # Run on every push to the default branch.
  push:
    branches: [main]
  # Re-evaluate when branch-protection rules change (most direct signal
  # for the Branch-Protection check).
  branch_protection_rule:

# Declare default read-only access for the whole workflow. Individual
# steps that need more (SARIF upload, OIDC for the OpenSSF publish call)
# escalate at the job level below.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Pin to ubuntu-24.04 to match every other workflow in the repo.
    # Avoids silent drift when GitHub flips the `ubuntu-latest` floor.
    runs-on: ubuntu-24.04
    # Observed runtime is well under a minute; 10 min gives headroom for
    # upstream API slowness without letting a hang burn the Actions quota.
    timeout-minutes: 10
    permissions:
      # Upload findings to the GitHub code-scanning UI.
      security-events: write
      # OIDC token so scorecard-action can publish to api.securityscorecards.dev.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          # Runs with the default GITHUB_TOKEN. Every check works with it
          # except Branch-Protection: this repo still uses GitHub's
          # *classic* branch-protection API, which the docs confirm is
          # admin-only — GITHUB_TOKEN can't read it, so that one check
          # errors internally and reports -1 (see
          # https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md).
          # This is a *narrowed*, not an eliminated, gap (see
          # https://github.com/yves-vogl/llm-ecosphere/issues/5):
          #   - Scorecard excludes -1 checks from the weighted aggregate
          #     rather than zeroing them out, so this does not depress the
          #     published score or fail the workflow.
          #   - Migrating `main`'s branch protection from the classic API
          #     to GitHub Repository Rulesets would let the default token
          #     read it directly — no PAT needed — but that's a
          #     repo-settings change with different semantics, tracked
          #     separately rather than folded in here.
          #   - If a real Branch-Protection score is wanted without that
          #     migration, a fine-grained PAT scoped to
          #     `Administration: Read-only` on this repo, stored as the
          #     `SCORECARD_READ_TOKEN` secret and passed as `repo_token`
          #     below, is the documented fix. Given this repo's current
          #     protection config (0 required approving reviews,
          #     enforce_admins off), that PAT would raise Branch-Protection
          #     from "unscored" to a modest low/mid score, not a high one —
          #     minting it is a judgement call for whoever owns repo
          #     secrets, not a default action.
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to api.securityscorecards.dev so the
          # README badge can read it. Public-good infrastructure run by
          # the Open Source Security Foundation (Linux Foundation).
          publish_results: true

      - name: Upload SARIF as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub code-scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
